<title>Aleesha Woa — Workers of Art</title>

<style>
  :root{
    --primary:#e6dfd5;
    --button:#000;
    --ink:#3b3b3b;
    --text:#555;
    --muted:#8c8c8c;
    --line:#e8e8e8;
    --link:#0a9396;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{background:var(--primary);color:var(--text);font-family:"Lato",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  a:hover{text-decoration:underline}
  a:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:2px}

  .card{position:relative;width:100%;max-width:500px;min-height:100vh;min-height:100svh;margin:0 auto;display:flex;flex-direction:column}

  .banner{position:relative;height:102px;background:var(--primary);overflow:hidden}
  .banner svg{position:absolute;inset:0;width:100%;height:100%}
  .avatar{position:absolute;top:9px;left:50%;z-index:2;width:84px;height:84px;margin-left:-42px;border-radius:50%;background:#fff;overflow:hidden}
  .avatar img{display:block;width:100%;height:100%;object-fit:cover}

  .sheet{flex:1;background:#fff;border-radius:24px 24px 0 0;margin-top:-1px;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
  .head{padding:22px 16px 14px;text-align:center}
  h1{color:var(--ink);font-size:18px;font-weight:700;line-height:1.3}
  .job{margin-top:6px;color:var(--muted);font-size:13px;font-weight:700}

  .action{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 16px 10px;border-block:2px solid var(--line);color:var(--ink);font-size:12px}
  .action:hover{text-decoration:none;background:#faf9f7}
  .action svg{width:18px;height:18px}

  .rows{list-style:none;padding:16px 16px 8px}
  .rows li{display:flex;gap:14px;align-items:flex-start;padding:10px 0;font-size:13px;line-height:18px}
  .rows svg{flex:none;width:18px;height:18px;margin-top:1px}
  .rows div,.rows a{min-width:0;overflow-wrap:anywhere}
  .map{display:block;margin-top:6px;color:var(--link);font-size:10px}

  svg.ico{fill:none;stroke:var(--primary);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  .save{display:block;margin:12px 16px 0;padding:13px 16px;border-radius:8px;background:var(--button);color:#fff;font-size:14px;font-weight:700;text-align:center}
  .save:hover{text-decoration:none;opacity:.85}
</style>
</head>
